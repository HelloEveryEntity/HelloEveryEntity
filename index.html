<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter Portfolio</title>
    <style>
        body {
            background-color: #0f172a; /* สีน้ำเงินเข้ม */
            color: #e2e8f0; /* สีขาวเทา */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        /* สไตล์ของปุ่ม */
        #reveal-btn {
            background: linear-gradient(45deg, #38bdf8, #22d3ee);
            color: #0f172a;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #reveal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(56, 189, 248, 0.3);
        }

        #reveal-btn:active {
            transform: translateY(1px);
        }

        /* ซ่อนปุ่มเมื่อกดแล้ว */
        #reveal-btn.hidden {
            display: none;
        }

        /* สไตล์ของกล่องข้อความ */
        #portfolio-content {
            font-size: 1.3rem;
            line-height: 1.8;
            max-width: 700px;
            text-align: left;
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            min-height: 300px; /* กำหนดความสูงขั้นต่ำเพื่อไม่ให้หน้าจอกระตุก */
        }

        /* ตัวอักษรที่ยังไม่ถูกพิมพ์ */
        .char {
            opacity: 0;
        }

        /* ตัวอักษรที่พิมพ์แล้วจะสว่างขึ้น */
        .char.revealed {
            opacity: 1;
            color: #34d399; /* สีเขียวมิ้นท์ */
            text-shadow: 0 0 5px rgba(52, 211, 153, 0.5);
        }

        /* Cursor กระพริบตอนท้าย */
        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #34d399;
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .highlight {
            color: #60a5fa; /* สีฟ้าอ่อนสำหรับเน้นคำ */
            font-weight: bold;
        }
    </style>
</head>
<body>

    <button id="reveal-btn">คลิกเพื่อเปิดเผยผลงาน</button>
    
    <div id="portfolio-content">
        <span id="text-container"></span>
        <span id="cursor" class="cursor">&nbsp;</span>
    </div>

    <script>
        // แก้ไขข้อความของคุณตรงนี้ได้เลย
        const portfolioText = `ยินดีต้อนรับสู่ Portfolio ของผม!

ผมคือนักออกแบบเกมที่หลงใหลในการสร้างประสบการณ์ที่น่าจดจำ...

📚 ทักษะหลัก:
- การออกแบบกลไกเกม (Game Mechanics)
- การเล่าเรื่องผ่านสภาพแวดล้อม (Environmental Storytelling)
- โปรแกรม: Godot, C#, Figma

🎯 โปรเจกต์ล่าสุด:
- [ชื่อเกม]: ดูรายละเอียดได้ที่ด้านล่าง...

ขอบคุณที่แวะมาเยี่ยมชมนะครับ!`;
        
        const textContainer = document.getElementById('text-container');
        const cursor = document.getElementById('cursor');
        const revealBtn = document.getElementById('reveal-btn');
        let currentIndex = 0;

        // ฟังก์ชันเริ่มอนิเมชั่น
        function startTypingEffect() {
            // ซ่อนปุ่มทันทีที่กด
            revealBtn.classList.add('hidden');
            
            // แปลงข้อความทั้งหมดให้เป็น tag span ทีละตัว
            portfolioText.split('').forEach(char => {
                const span = document.createElement('span');
                span.textContent = char;
                if (char === '\n') {
                    span.innerHTML = '<br>';
                }
                span.className = 'char';
                textContainer.appendChild(span);
            });

            const charElements = document.querySelectorAll('.char');
            
            // แสดงตัวอักษรทีละตัวตามช่วงเวลาที่กำหนด (ms)
            const typingInterval = setInterval(() => {
                if (currentIndex < charElements.length) {
                    charElements[currentIndex].classList.add('revealed');
                    currentIndex++;
                } else {
                    // เมื่อพิมพ์เสร็จสิ้น ให้หยุด Interval และซ่อน Cursor
                    clearInterval(typingInterval);
                    cursor.style.display = 'none';
                }
            }, 50); // ปรับเลขนี้ให้เร็วหรือช้าลงได้ (50ms คือความเร็วปานกลาง)
        }

        // ผูกฟังก์ชันเข้ากับปุ่มคลิก
        revealBtn.addEventListener('click', startTypingEffect);
    </script>

</body>
</html>
