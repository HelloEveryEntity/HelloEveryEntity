<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portfolio</title>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        /* กล่องรวมปุ่มเลือกทางเลือก */
        .button-container {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: linear-gradient(45deg, #38bdf8, #22d3ee);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(56, 189, 248, 0.3);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* สไตล์ปุ่มทางเลือกที่ 2 (สีต่างกันนิดหน่อยเพื่อแยกแยะ) */
        .btn-alt {
            background: linear-gradient(45deg, #34d399, #10b981);
        }

        /* ซ่อนปุ่มทั้งหมดเมื่อเลือกทางใดทางหนึ่งแล้ว */
        .button-container.hidden {
            display: none;
        }

        /* กล่องแสดงข้อความ */
        #portfolio-content {
            font-size: 1.2rem;
            line-height: 1.8;
            max-width: 750px;
            text-align: left;
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            min-height: 250px;
            width: 100%;
            box-sizing: border-box;
        }

        .char {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .char.revealed {
            opacity: 1;
            color: #34d399;
            text-shadow: 0 0 5px rgba(52, 211, 153, 0.4);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #34d399;
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .instruction-manual {
            color: #64748b;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 2 ปุ่มเลือกทางเลือก -->
    <div id="btn-group" class="button-container">
        <button id="auto-btn" class="btn">🚀 กดเพื่อให้พิมพ์อัตโนมัติ</button>
        <button id="manual-btn" class="btn btn-alt">⌨️ กดปุ่มคีย์บอร์ด/หน้าจอเพื่อพิมพ์เอง</button>
    </div>

    <!-- คำแนะนำเพิ่มเติมเฉพาะตอนเลือกโหมดพิมพ์เอง -->
    <div id="manual-instruction" class="instruction-manual">
        [ ตอนนี้อยู่ในโหมดอิสระ: กดปุ่มอะไรก็ได้บนคีย์บอร์ดหรือคลิกเพื่อเปิดข้อความ ]
    </div>
    
    <!-- กล่องแสดงข้อความ -->
    <div id="portfolio-content">
        <span id="text-container"></span>
        <span id="cursor" class="cursor">&nbsp;</span>
    </div>

    <script>
        const portfolioText = `ยินดีต้อนรับสู่ Portfolio ของผม!

ผมคือนักออกแบบเกมที่หลงใหลในการสร้างประสบการณ์ที่น่าจดจำ...

📚 ทักษะหลัก:
- การออกแบบกลไกเกม (Game Mechanics)
- การเล่าเรื่องผ่านสภาพแวดล้อม (Environmental Storytelling)
- โปรแกรม: Godot, C#, Figma

🎯 โปรเจกต์ล่าสุด:
- [ชื่อเกม]: ดูรายละเอียดได้ที่ด้านล่าง...

ขอบคุณที่แวะมาเยี่ยมชมนะครับ!`;
        
        const textContainer = document.getElementById('text-container');
        const cursor = document.getElementById('cursor');
        const btnGroup = document.getElementById('btn-group');
        const autoBtn = document.getElementById('auto-btn');
        const manualBtn = document.getElementById('manual-btn');
        const manualInstruction = document.getElementById('manual-instruction');
        
        let currentIndex = 0;
        let isModeSelected = false;

        // เตรียมแปลงตัวอักษรใส่ span ไว้ล่วงหน้า
        portfolioText.split('').forEach(char => {
            const span = document.createElement('span');
            span.textContent = char;
            if (char === '\n') {
                span.innerHTML = '<br>';
            }
            span.className = 'char';
            textContainer.appendChild(span);
        });

        const charElements = document.querySelectorAll('.char');

        // ทางเลือกที่ 1: พิมพ์อัตโนมัติทีละตัวเมื่อกดปุ่มแรก
        autoBtn.addEventListener('click', () => {
            if (isModeSelected) return;
            isModeSelected = true;
            btnGroup.classList.add('hidden');

            const typingInterval = setInterval(() => {
                if (currentIndex < charElements.length) {
                    charElements[currentIndex].classList.add('revealed');
                    currentIndex++;
                } else {
                    clearInterval(typingInterval);
                    cursor.style.display = 'none';
                }
            }, 50); // ความเร็วในการพิมพ์อัตโนมัติ
        });

        // ทางเลือกที่ 2: กดปุ่มคีย์บอร์ดหรือคลิกเพื่อเปิดทีละนิดเอง
        manualBtn.addEventListener('click', () => {
            if (isModeSelected) return;
            isModeSelected = true;
            btnGroup.classList.add('hidden');
            manualInstruction.style.display = 'block'; // แสดงคำแนะนำวิธีเล่นโหมดนี้
        });

        // ฟังก์ชันเปิดข้อความทีละหลายตัวเมื่อกดปุ่มคีย์บอร์ดหรือคลิก (ใช้เฉพาะตอนเลือกโหมดที่ 2)
        function revealByStep() {
            // ถ้ายังไม่ได้เลือกโหมดที่ 2 หรือข้อความเปิดครบแล้ว ไม่ต้องทำอะไร
            if (!manualInstruction.style.display || manualInstruction.style.display === 'none') return;
            
            if (currentIndex < charElements.length) {
                for (let i = 0; i < 3; i++) { // กด 1 ครั้ง โผล่มา 3 ตัวอักษร
                    if (currentIndex < charElements.length) {
                        charElements[currentIndex].classList.add('revealed');
                        currentIndex++;
                    }
                }
                if (currentIndex >= charElements.length) {
                    cursor.style.display = 'none';
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (['F12', 'Control', 'Alt', 'Shift'].includes(e.key)) return;
            revealByStep();
        });

        window.addEventListener('click', (e) => {
            // ป้องกันไม่ให้คลิกโดนปุ่มตอนเลือกโหมดซ้ำซ้อน
            if (e.target.tagName === 'BUTTON') return;
            revealByStep();
        });
    </script>

</body>
</html>
