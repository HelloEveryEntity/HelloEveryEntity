<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portfolio</title>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .instruction {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ปุ่ม RevealAll */
        #auto-btn {
            background: linear-gradient(45deg, #38bdf8, #22d3ee);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: none;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #auto-btn.show {
            display: inline-block;
            opacity: 1;
            transform: translateY(0);
        }

        #auto-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(56, 189, 248, 0.3);
        }

        #auto-btn:active {
            transform: translateY(1px);
        }

        /* ส่วนแสดงผลหลัก */
        .main-container {
            display: flex;
            gap: 30px;
            max-width: 950px;
            width: 100%;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* กล่องข้อความ */
        #portfolio-content {
            font-size: 1.1rem;
            line-height: 1.8;
            flex: 1;
            min-width: 300px;
            text-align: left;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            min-height: 250px;
            box-sizing: border-box;
        }

        /* กล่องรูปภาพ */
        #image-container {
            width: 220px;
            text-align: center;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.6s ease, transform 0.6s ease;
            display: none;
        }

        #image-container.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        #image-container img {
            width: 100%;
            border-radius: 10px;
            border: 2px solid #38bdf8;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        #image-container img:hover {
            transform: scale(1.03);
        }

        .img-caption {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 8px;
        }

        /* Modal พร้อม Motion แอนิเมชันขยายเข้า-ออก */
        #imageModal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0); /* เริ่มต้นฉากหลังใส */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            transition: background-color 0.4s ease; /* โมชั่นเฟดสีพื้นหลัง */
        }

        #imageModal.active {
            background-color: rgba(0, 0, 0, 0.85); /* เฟดให้มืดลงตอนเปิด */
        }

        #modalImg {
            max-width: 85%;
            max-height: 80vh;
            border-radius: 10px;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
            transform: scale(0.5); /* เริ่มต้นรูปขนาดเล็ก */
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease; /* โมชั่นเด้งสมูท (Spring effect เล็กน้อย) */
        }

        #imageModal.active #modalImg {
            transform: scale(1); /* ขยายเต็มขนาด */
            opacity: 1;
        }

        .modal-text {
            color: #e2e8f0;
            margin-top: 15px;
            font-size: 1rem;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s ease 0.2s;
        }

        #imageModal.active .modal-text {
            opacity: 1;
        }

        .char {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .char.revealed {
            opacity: 1;
            color: #34d399;
            text-shadow: 0 0 5px rgba(52, 211, 153, 0.4);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #34d399;
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="instruction">[ Type to continue ]</div>
    
    <!-- ปุ่ม RevealAll -->
    <button id="auto-btn">RevealAll</button>

    <!-- พื้นที่แสดงข้อความและรูปภาพ -->
    <div class="main-container">
        <div id="portfolio-content">
            <span id="text-container"></span>
            <span id="cursor" class="cursor">&nbsp;</span>
        </div>

        <div id="image-container">
            <img id="myImg" src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80" alt="Game Dev Setup">
            <div class="img-caption">🔍 คลิกที่รูปเพื่อขยายใหญ่</div>
        </div>
    </div>

    <!-- หน้าต่าง Modal สำหรับแสดงรูปใหญ่พร้อม Motion -->
    <div id="imageModal">
        <img id="modalImg">
        <div class="modal-text">[ คลิกที่ไหนก็ได้เพื่อปิด ]</div>
    </div>

    <script>
        const portfolioText = `ยินดีต้อนรับสู่ Portfolio ของผม!

ผมคือนักออกแบบเกมที่หลงใหลในการสร้างประสบการณ์ที่น่าจดจำ...

📚 ทักษะหลัก:
- การออกแบบกลไกเกม (Game Mechanics)
- การเล่าเรื่องผ่านสภาพแวดล้อม (Environmental Storytelling)
- โปรแกรม: Godot, C#, Figma

🎯 โปรเจกต์ล่าสุด:
- [ชื่อเกม]: ดูรายละเอียดได้ที่ด้านล่าง...

ขอบคุณที่แวะมาเยี่ยมชมนะครับ!`;
        
        const textContainer = document.getElementById('text-container');
        const cursor = document.getElementById('cursor');
        const autoBtn = document.getElementById('auto-btn');
        const imageContainer = document.getElementById('image-container');
        
        const modal = document.getElementById('imageModal');
        const img = document.getElementById('myImg');
        const modalImg = document.getElementById('modalImg');

        // เปิดรูปใหญ่พร้อมใส่คลาส active เพื่อเล่น Motion ขยาย
        img.addEventListener('click', () => {
            modalImg.src = img.src;
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('active');
            }, 10); // ดีเลย์เล็กน้อยเพื่อให้เบราว์เซอร์เรนเดอร์ทัน
        });

        // ปิดรูปใหญ่ (เล่น Motion ย่อเก็บเข้าที่เดิมก่อนซ่อน)
        modal.addEventListener('click', () => {
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 400); // รอให้แอนิเมชันเล่นจบ (0.4 วินาที) แล้วค่อยซ่อน display
        });

        let currentIndex = 0;
        let isFinished = false;
        let autoInterval = null;
        let lineBreakCount = 0; 

        portfolioText.split('').forEach(char => {
            const span = document.createElement('span');
            span.textContent = char;
            if (char === '\n') {
                span.innerHTML = '<br>';
            }
            span.className = 'char';
            textContainer.appendChild(span);
        });

        const charElements = document.querySelectorAll('.char');

        function revealSteps(count = 3) {
            if (isFinished) return;
            
            for (let i = 0; i < count; i++) {
                if (currentIndex < charElements.length) {
                    const currentSpan = charElements[currentIndex];
                    currentSpan.classList.add('revealed');
                    
                    if (currentSpan.textContent === '\n' || currentSpan.innerHTML === '<br>') {
                        lineBreakCount++;
                        
                        if (lineBreakCount >= 3) {
                            autoBtn.classList.add('show');
                        }

                        if (lineBreakCount >= 5) {
                            imageContainer.classList.add('show');
                        }
                    }

                    currentIndex++;
                } else {
                    isFinished = true;
                    cursor.style.display = 'none';
                    autoBtn.style.display = 'none';
                    imageContainer.classList.add('show');
                    break;
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (['F12', 'Control', 'Alt', 'Shift'].includes(e.key)) return;
            if (autoInterval) return; 
            if (modal.classList.contains('active')) return; // ถ้าเปิดรูปใหญ่อยู่ ไม่ให้พิมพ์ข้อความ
            revealSteps(3);
        });

        window.addEventListener('click', (e) => {
            if (e.target.id === 'auto-btn' || e.target.id === 'myImg' || modal.classList.contains('active')) return;
            if (autoInterval) return;
            revealSteps(3);
        });

        autoBtn.addEventListener('click', () => {
            if (isFinished || autoInterval) return;
            
            autoBtn.textContent = "Revealing...";
            autoBtn.style.opacity = "0.7";

            autoInterval = setInterval(() => {
                if (currentIndex < charElements.length) {
                    revealSteps(2);
                } else {
                    clearInterval(autoInterval);
                    autoBtn.style.display = 'none';
                    imageContainer.classList.add('show');
                }
            }, 30);
        });
    </script>

</body>
</html>
