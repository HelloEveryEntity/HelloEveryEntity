<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portfolio</title>
    <style>
        body {
            background-color: #07090e;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: gridMove 15s linear infinite;
            
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        @keyframes gridMove {
            from {
                background-position: 0 0;
            }
            to {
                background-position: -300px -300px;
            }
        }

        /* --- สไตล์สำหรับรูปภาพที่ร่วงหล่น (ควบคุมตำแหน่งผ่าน JS) --- */
        .falling-img {
            position: absolute;
            top: -120px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #38bdf8;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            pointer-events: none;
            z-index: 0;
            will-change: transform, opacity;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            z-index: -2;
            pointer-events: none;
            opacity: 0.35;
            mix-blend-mode: screen;
            animation: colorShift 12s ease-in-out infinite alternate, floatOrb 20s ease-in-out infinite alternate;
        }

        @keyframes colorShift {
            0% { filter: blur(70px) hue-rotate(0deg); }
            50% { filter: blur(75px) hue-rotate(180deg); }
            100% { filter: blur(70px) hue-rotate(360deg); }
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(120px, -90px) scale(1.25); }
            100% { transform: translate(-100px, 140px) scale(0.85); }
        }

        .instruction {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 1;
        }

        /* ปุ่ม RevealAll */
        #auto-btn {
            background: linear-gradient(45deg, #38bdf8, #22d3ee);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: none;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 1;
        }

        #auto-btn.show {
            display: inline-block;
            opacity: 1;
            transform: translateY(0);
        }

        #auto-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(56, 189, 248, 0.3);
        }

        #auto-btn:active {
            transform: translateY(1px);
        }

        /* ส่วนแสดงผลหลัก */
        .main-container {
            display: flex;
            gap: 30px;
            max-width: 950px;
            width: 100%;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            z-index: 1;
        }

        /* กล่องข้อความ */
        #portfolio-content {
            font-size: 1.1rem;
            line-height: 1.8;
            flex: 1;
            min-width: 300px;
            text-align: left;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            min-height: 250px;
            box-sizing: border-box;
        }

        /* คอลัมน์ขวา */
        .right-column {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.6s ease, transform 0.6s ease;
            display: none;
        }

        .right-column.show {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        /* กล่องรูปภาพหลัก */
        #image-container {
            width: 100%;
            text-align: center;
        }

        #image-container img {
            width: 100%;
            border-radius: 10px;
            border: 2px solid #38bdf8;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
            cursor: pointer;
            transition: transform 0.3s ease;
            display: block;
        }

        #image-container img:hover {
            transform: scale(1.03);
        }

        .img-caption {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 8px;
        }

        /* สไตล์ปุ่มลิงก์พอร์ตโฟลิโอ */
        .port-link-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .port-link-top-text {
            font-size: 0.85rem;
            color: #38bdf8;
            margin-bottom: 5px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .port-link-btn {
            width: 100%;
            height: 45px;
            background: linear-gradient(45deg, #0ea5e9, #2563eb);
            color: #ffffff;
            border: 2px solid #38bdf8;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .port-link-btn:hover {
            background: linear-gradient(45deg, #2563eb, #38bdf8);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.5);
        }

        .port-link-bottom-text {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* Modal ขยายรูป */
        #imageModal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            transition: background-color 0.4s ease;
        }

        #imageModal.active {
            background-color: rgba(7, 9, 14, 0.9);
        }

        #modalImg {
            max-width: 85%;
            max-height: 80vh;
            border-radius: 10px;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
            transform: scale(0.5);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
        }

        #imageModal.active #modalImg {
            transform: scale(1);
            opacity: 1;
        }

        .modal-text {
            color: #e2e8f0;
            margin-top: 15px;
            font-size: 1rem;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s ease 0.2s;
        }

        #imageModal.active .modal-text {
            opacity: 1;
        }

        .char {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .char.revealed {
            opacity: 1;
            color: #34d399;
            text-shadow: 0 0 5px rgba(52, 211, 153, 0.4);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #34d399;
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="orb-container"></div>
    <div id="rain-container"></div>

    <div class="instruction">[ Type to continue ]</div>
    
    <button id="auto-btn">RevealAll</button>

    <div class="main-container">
        <div id="portfolio-content">
            <span id="text-container"></span>
            <span id="cursor" class="cursor">&nbsp;</span>
        </div>

        <div id="rightColumn" class="right-column">
            <div id="image-container">
                <img id="myImg" src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80" alt="Game Dev Setup">
                <div class="img-caption">🔍 คลิกที่รูปเพื่อขยายใหญ่</div>
            </div>

            <div class="port-link-wrapper">
                <div class="port-link-top-text">Port Link</div>
                <a href="https://github.com" target="_blank" class="port-link-btn">VISIT PORT</a>
                <div class="port-link-bottom-text">Go To Port</div>
            </div>
        </div>
    </div>

    <div id="imageModal">
        <img id="modalImg">
        <div class="modal-text">[ คลิกที่ไหนก็ได้เพื่อปิด ]</div>
    </div>

    <script>
        // --- ระบบฝนรูปภาพด้วย JavaScript (สุ่มขนาด + เลือนหายตามเวลาและหลุดจอ) ---
        window.addEventListener('DOMContentLoaded', () => {
            const orbContainer = document.getElementById('orb-container');
            const rainContainer = document.getElementById('rain-container');

            // สุ่มก้อนแสงพื้นหลัง
            const orbCount = Math.floor(Math.random() * 4) + 3;
            const colors = ['#38bdf8', '#34d399', '#a78bfa', '#f472b6', '#38ef7d'];
            for (let i = 0; i < orbCount; i++) {
                const orb = document.createElement('div');
                orb.className = 'bg-orb';
                const size = Math.floor(Math.random() * 200) + 250;
                orb.style.width = `${size}px`;
                orb.style.height = `${size}px`;
                orb.style.top = `${Math.random() * 80}%`;
                orb.style.left = `${Math.random() * 80}%`;
                orb.style.background = colors[Math.floor(Math.random() * colors.length)];
                orb.style.animationDuration = `${Math.random() * 10 + 10}s, ${Math.random() * 15 + 15}s`;
                orbContainer.appendChild(orb);
            }

            // 1. รายการรูปชั่วคราว 10 รูป (สามารถเปลี่ยนเป็นชื่อไฟล์ในเครื่องของคุณได้ทีหลัง)
            const rainImages = [
                "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=300&q=80",
                "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=300&q=80"
            ];

            const totalDrops = 22; // จำนวนรูปที่ร่วงพร้อมกัน (แน่นสะใจ)

            for (let i = 0; i < totalDrops; i++) {
                createFallingImage();
            }

            function createFallingImage() {
                const img = document.createElement('img');
                img.className = 'falling-img';
                img.src = rainImages[Math.floor(Math.random() * rainImages.length)];
                
                // 2. กำหนดขนาดให้พอเหมาะ (ระหว่าง 65px ถึง 105px) และสุ่มขนาดต่อรูป
                const width = Math.floor(Math.random() * 40) + 65;
                img.style.width = `${width}px`;

                // สุ่มตำแหน่งแนวนอน
                let posX = Math.random() * 95;
                img.style.left = `${posX}%`;

                // กำหนดค่าเริ่มต้นสำหรับการเคลื่อนไหวผ่าน JS
                let posY = -150; // เริ่มต้นเหนือจอ
                let speed = Math.random() * 1.5 + 1.2; // ความเร็วในการร่วง
                let rotation = Math.random() * 60 - 30; // มุมเอียงเริ่มต้น
                let rotSpeed = Math.random() * 0.8 - 0.4; // ความเร็วในการหมุนตัว
                let opacity = 0;
                let maxOpacity = Math.random() * 0.4 + 0.4; // ความโปร่งใสสูงสุด (0.4 - 0.8)

                rainContainer.appendChild(img);

                function animateDrop() {
                    posY += speed;
                    rotation += rotSpeed;

                    // 4. ระบบเลือนหายตามเวลา (Fade In ตอนต้น และ Fade Out เมื่อใกล้ขอบล่างจอ)
                    let screenHeight = window.innerHeight;
                    if (posY < 100) {
                        opacity = Math.min(maxOpacity, opacity + 0.03); // ค่อยๆ ปรากฏตอนเริ่มตก
                    } else if (posY > screenHeight - 200) {
                        opacity = Math.max(0, opacity - 0.02); // ค่อยๆ เลือนหายเมื่อใกล้ถึงขอบล่าง
                    } else {
                        opacity = maxOpacity;
                    }

                    img.style.transform = `translateY(${posY}px) rotate(${rotation}deg)`;
                    img.style.opacity = opacity;

                    // ถ้าร่วงพ้นขอบล่างจอไปแล้ว ให้รีเซ็ตตำแหน่งกลับไปด้านบนสุดใหม่ทันที (วนลูปไม่รู้จบ)
                    if (posY > screenHeight + 100) {
                        img.remove();
                        createFallingImage(); // สร้างรูปใหม่มาแทนที่
                        return;
                    }

                    requestAnimationFrame(animateDrop);
                }

                // ดีเลย์เวลาเริ่มต้นไม่ให้ร่วงลงมาพรวดเดียวพร้อมกันตอนรีเฟรช
                setTimeout(() => {
                    requestAnimationFrame(animateDrop);
                }, Math.random() * 6000);
            }
        });

        // --- ระบบพิมพ์ข้อความ ---
        const portfolioText = `ยินดีต้อนรับสู่ Portfolio ของผม!

ผมคือนักออกแบบเกมที่หลงใหลในการสร้างประสบการณ์ที่น่าจดจำ...

📚 ทักษะหลัก:
- การออกแบบกลไกเกม (Game Mechanics)
- การเล่าเรื่องผ่านสภาพแวดล้อม (Environmental Storytelling)
- โปรแกรม: Godot, C#, Figma

🎯 โปรเจกต์ล่าสุด:
- [ชื่อเกม]: ดูรายละเอียดได้ที่ด้านล่าง...

ขอบคุณที่แวะมาเยี่ยมชมนะครับ!`;
        
        const textContainer = document.getElementById('text-container');
        const cursor = document.getElementById('cursor');
        const autoBtn = document.getElementById('auto-btn');
        const rightColumn = document.getElementById('rightColumn');
        
        const modal = document.getElementById('imageModal');
        const img = document.getElementById('myImg');
        const modalImg = document.getElementById('modalImg');

        img.addEventListener('click', () => {
            modalImg.src = img.src;
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('active');
            }, 10);
        });

        modal.addEventListener('click', () => {
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 400);
        });

        let currentIndex = 0;
        let isFinished = false;
        let autoInterval = null;
        let lineBreakCount = 0; 

        portfolioText.split('').forEach(char => {
            const span = document.createElement('span');
            span.textContent = char;
            if (char === '\n') {
                span.innerHTML = '<br>';
            }
            span.className = 'char';
            textContainer.appendChild(span);
        });

        const charElements = document.querySelectorAll('.char');

        function revealSteps(count = 3) {
            if (isFinished) return;
            
            for (let i = 0; i < count; i++) {
                if (currentIndex < charElements.length) {
                    const currentSpan = charElements[currentIndex];
                    currentSpan.classList.add('revealed');
                    
                    if (currentSpan.textContent === '\n' || currentSpan.innerHTML === '<br>') {
                        lineBreakCount++;
                        
                        if (lineBreakCount >= 3) {
                            autoBtn.classList.add('show');
                        }

                        if (lineBreakCount >= 5) {
                            rightColumn.classList.add('show');
                        }
                    }

                    currentIndex++;
                } else {
                    isFinished = true;
                    cursor.style.display = 'none';
                    autoBtn.style.display = 'none';
                    rightColumn.classList.add('show');
                    break;
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (['F12', 'Control', 'Alt', 'Shift'].includes(e.key)) return;
            if (autoInterval) return; 
            if (modal.classList.contains('active')) return;
            revealSteps(3);
        });

        window.addEventListener('click', (e) => {
            if (e.target.id === 'auto-btn' || e.target.id === 'myImg' || e.target.closest('.port-link-btn') || modal.classList.contains('active')) return;
            if (autoInterval) return;
            revealSteps(3);
        });

        autoBtn.addEventListener('click', () => {
            if (isFinished || autoInterval) return;
            
            autoBtn.textContent = "Revealing...";
            autoBtn.style.opacity = "0.7";

            autoInterval = setInterval(() => {
                if (currentIndex < charElements.length) {
                    revealSteps(2);
                } else {
                    clearInterval(autoInterval);
                    autoBtn.style.display = 'none';
                    rightColumn.classList.add('show');
                }
            }, 30);
        });
    </script>

</body>
</html>
