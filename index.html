<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portfolio</title>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        /* สไตล์ปุ่มกด */
        #reveal-btn {
            background: linear-gradient(45deg, #38bdf8, #22d3ee);
            color: #0f172a;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #reveal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(56, 189, 248, 0.3);
        }

        #reveal-btn:active {
            transform: translateY(1px);
        }

        /* ซ่อนปุ่มเมื่อกำลังพิมพ์อยู่ */
        #reveal-btn.hidden {
            display: none;
        }

        /* กล่องแสดงข้อความ */
        #portfolio-content {
            font-size: 1.2rem;
            line-height: 1.8;
            max-width: 750px;
            text-align: left;
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            min-height: 250px;
            width: 100%;
            box-sizing: border-box;
        }

        .char {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .char.revealed {
            opacity: 1;
            color: #34d399;
            text-shadow: 0 0 5px rgba(52, 211, 153, 0.4);
        }

        /* เคอร์เซอร์กระพริบระหว่างพิมพ์ */
        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #34d399;
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- ปุ่มเดียวสำหรับกดเริ่มแสดงผล -->
    <button id="reveal-btn">▶ กดเพื่อแสดงเนื้อหา</button>
    
    <!-- กล่องแสดงข้อความ -->
    <div id="portfolio-content">
        <span id="text-container"></span>
        <span id="cursor" class="cursor" style="display: none;">&nbsp;</span>
    </div>

    <script>
        // แก้ไขข้อความพอร์ตโฟลิโอของคุณเองตรงนี้ได้เลยครับ
        const portfolioText = `ยินดีต้อนรับสู่ Portfolio ของผม!

ผมคือนักออกแบบเกมที่หลงใหลในการสร้างประสบการณ์ที่น่าจดจำ...

📚 ทักษะหลัก:
- การออกแบบกลไกเกม (Game Mechanics)
- การเล่าเรื่องผ่านสภาพแวดล้อม (Environmental Storytelling)
- โปรแกรม: Godot, C#, Figma

🎯 โปรเจกต์ล่าสุด:
- [ชื่อเกม]: ดูรายละเอียดได้ที่ด้านล่าง...

ขอบคุณที่แวะมาเยี่ยมชมนะครับ!`;
        
        const textContainer = document.getElementById('text-container');
        const cursor = document.getElementById('cursor');
        const revealBtn = document.getElementById('reveal-btn');
        let currentIndex = 0;

        // แปลงข้อความทั้งหมดให้เป็น span ตัวอักษรซ่อนไว้ล่วงหน้า
        portfolioText.split('').forEach(char => {
            const span = document.createElement('span');
            span.textContent = char;
            if (char === '\n') {
                span.innerHTML = '<br>';
            }
            span.className = 'char';
            textContainer.appendChild(span);
        });

        const charElements = document.querySelectorAll('.char');

        // เมื่อกดปุ่ม ให้เริ่มกระบวนการพิมพ์อัตโนมัติ
        revealBtn.addEventListener('click', () => {
            revealBtn.classList.add('hidden'); // ซ่อนปุ่ม
            cursor.style.display = 'inline-block'; // แสดงเคอร์เซอร์กระพริบ

            // ตั้งเวลาให้ตัวอักษรค่อยๆ ปรากฏขึ้นมาทีละตัว
            const typingInterval = setInterval(() => {
                if (currentIndex < charElements.length) {
                    charElements[currentIndex].classList.add('revealed');
                    currentIndex++;
                } else {
                    // เมื่อพิมพ์ครบทุกตัวแล้ว ให้หยุดและซ่อนเคอร์เซอร์
                    clearInterval(typingInterval);
                    cursor.style.display = 'none';
                }
            }, 45); // ปรับความเร็วตรงนี้ได้ (เลขน้อยลงจะพิมพ์เร็วขึ้น, มากขึ้นจะพิมพ์ช้าลง)
        });
    </script>

</body>
</html>
