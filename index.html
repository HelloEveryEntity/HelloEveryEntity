<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portfolio</title>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .instruction {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* ปุ่มกดอัตโนมัติ (เผื่อขี้เกียจพิมพ์) */
        #auto-btn {
            background: linear-gradient(45deg, #38bdf8, #22d3ee);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #auto-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(56, 189, 248, 0.3);
        }

        #auto-btn:active {
            transform: translateY(1px);
        }

        /* กล่องแสดงข้อความ */
        #portfolio-content {
            font-size: 1.2rem;
            line-height: 1.8;
            max-width: 750px;
            text-align: left;
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            min-height: 250px;
            width: 100%;
            box-sizing: border-box;
        }

        .char {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .char.revealed {
            opacity: 1;
            color: #34d399;
            text-shadow: 0 0 5px rgba(52, 211, 153, 0.4);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #34d399;
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="instruction">[ กดปุ่มอะไรก็ได้บนคีย์บอร์ด หรือคลิกเพื่อเปิดข้อความทีละตัว ]</div>
    
    <!-- ปุ่มกดเปิดอัตโนมัติสำหรับคนขี้เกียจพิมพ์ -->
    <button id="auto-btn">⚡ ขี้เกียจพิมพ์? คลิกเพื่อเปิดอัตโนมัติ</button>

    <!-- กล่องแสดงข้อความ -->
    <div id="portfolio-content">
        <span id="text-container"></span>
        <span id="cursor" class="cursor">&nbsp;</span>
    </div>

    <script>
        // แก้ไขข้อความของคุณตรงนี้ได้เลย
        const portfolioText = `ยินดีต้อนรับสู่ Portfolio ของผม!

ผมคือนักออกแบบเกมที่หลงใหลในการสร้างประสบการณ์ที่น่าจดจำ...

📚 ทักษะหลัก:
- การออกแบบกลไกเกม (Game Mechanics)
- การเล่าเรื่องผ่านสภาพแวดล้อม (Environmental Storytelling)
- โปรแกรม: Godot, C#, Figma

🎯 โปรเจกต์ล่าสุด:
- [ชื่อเกม]: ดูรายละเอียดได้ที่ด้านล่าง...

ขอบคุณที่แวะมาเยี่ยมชมนะครับ!`;
        
        const textContainer = document.getElementById('text-container');
        const cursor = document.getElementById('cursor');
        const autoBtn = document.getElementById('auto-btn');
        
        let currentIndex = 0;
        let isFinished = false;
        let autoInterval = null;

        // แปลงข้อความทั้งหมดให้เป็นตัวอักษรย่อยๆ ซ่อนไว้
        portfolioText.split('').forEach(char => {
            const span = document.createElement('span');
            span.textContent = char;
            if (char === '\n') {
                span.innerHTML = '<br>';
            }
            span.className = 'char';
            textContainer.appendChild(span);
        });

        const charElements = document.querySelectorAll('.char');

        // ฟังก์ชันเปิดข้อความทีละหลายตัว (สำหรับการพิมพ์ทีละแอด)
        function revealSteps(count = 3) {
            if (isFinished) return;
            
            for (let i = 0; i < count; i++) {
                if (currentIndex < charElements.length) {
                    charElements[currentIndex].classList.add('revealed');
                    currentIndex++;
                } else {
                    isFinished = true;
                    cursor.style.display = 'none';
                    autoBtn.style.display = 'none'; // ซ่อนปุ่มเมื่อพิมพ์จบแล้ว
                    break;
                }
            }
        }

        // ระบบกดปุ่มคีย์บอร์ด หรือคลิกเพื่อพิมพ์เองทีละนิด
        window.addEventListener('keydown', (e) => {
            if (['F12', 'Control', 'Alt', 'Shift'].includes(e.key)) return;
            // ถ้ากดปุ่มอัตโนมัติค้างไว้ ไม่ต้องรับคีย์บอร์ดซ้ำ
            if (autoInterval) return; 
            revealSteps(3); // กด 1 ครั้ง โผล่มา 3 ตัวอักษร
        });

        window.addEventListener('click', (e) => {
            if (e.target.id === 'auto-btn') return; // ยกเว้นถ้าคลิกที่ปุ่มออโต้
            if (autoInterval) return;
            revealSteps(3);
        });

        // ระบบกดปุ่ม "ขี้เกียจพิมพ์" (พิมพ์อัตโนมัติรัวๆ จนจบ)
        autoBtn.addEventListener('click', () => {
            if (isFinished || autoInterval) return;
            
            autoBtn.textContent = "กำลังเปิดข้อความอัตโนมัติ...";
            autoBtn.style.opacity = "0.7";

            // สั่งรันออโต้รัวๆ จนกว่าจะหมด
            autoInterval = setInterval(() => {
                if (currentIndex < charElements.length) {
                    revealSteps(2); // ความเร็วอัตโนมัติ
                } else {
                    clearInterval(autoInterval);
                    autoBtn.style.display = 'none';
                }
            }, 30);
        });
    </script>

</body>
</html>
